name: Lancer DAST

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: 'URL to scan'
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build lancer
        run: cargo build --release --bin lancer

      - name: Generate CA + start proxy
        run: |
          ./target/release/lancer cert init --dir ./ca
          ./target/release/lancer project new --path ./scan.lancer --name "CI"

      - name: Run scan
        env:
          TARGET: ${{ github.event.inputs.target || 'https://example.com/' }}
        run: |
          ./target/release/lancer scan full "$TARGET" --project ./scan.lancer

      - name: Render SARIF report
        run: ./target/release/lancer report --project ./scan.lancer --format sarif --out lancer.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: lancer.sarif

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: lancer-report
          path: lancer.sarif
