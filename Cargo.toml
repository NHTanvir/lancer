[workspace]
resolver = "2"
members = [
    "crates/lancer-core",
    "crates/lancer-storage",
    "crates/lancer-proxy",
    "crates/lancer-tools",
    "crates/lancer-scanner",
    "crates/lancer-script",
    "crates/lancer-report",
    "crates/lancer-ai",
    "crates/lancer-session",
    "crates/lancer-plugin",
    "crates/lancer-scheduler",
    "crates/lancer-api",
    "crates/lancer-gui",
    "crates/lancer-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lancer-sec/lancer"
authors = ["Lancer contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tokio-rustls = "0.26"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
bytes = "1.7"
pin-project-lite = "0.2"

# HTTP / networking
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.1"
http-body = "1"
http-body-util = "0.1"
httparse = "1.9"
url = "2.5"
mime = "0.3"
percent-encoding = "2.3"

# TLS / crypto
rustls = "0.23"
rustls-pemfile = "2.1"
webpki-roots = "0.26"
rcgen = "0.13"
x509-parser = "0.16"
time = "0.3"
rand = "0.8"
ring = "0.17"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
md2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
flate2 = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = { version = "0.36", features = ["serialize"] }

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "6.1"
arc-swap = "1.7"
regex = "1.10"
glob = "0.3"
walkdir = "2.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Scripting
rhai = { version = "1.19", features = ["sync", "serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
console = "0.15"

# Internal crates
lancer-core = { path = "crates/lancer-core" }
lancer-storage = { path = "crates/lancer-storage" }
lancer-proxy = { path = "crates/lancer-proxy" }
lancer-tools = { path = "crates/lancer-tools" }
lancer-scanner = { path = "crates/lancer-scanner" }
lancer-script = { path = "crates/lancer-script" }
lancer-report = { path = "crates/lancer-report" }
lancer-ai = { path = "crates/lancer-ai" }
lancer-session = { path = "crates/lancer-session" }
lancer-plugin = { path = "crates/lancer-plugin" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
