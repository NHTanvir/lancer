[package]
name = "lancer-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
uuid         = { version = "1", features = ["v4", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
regex        = "1"
once_cell    = "1"
