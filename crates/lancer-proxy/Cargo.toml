[package]
name = "lancer-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TLS MITM intercepting proxy core for Lancer."

[dependencies]
lancer-core.workspace = true
lancer-storage.workspace = true

tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
httparse.workspace = true
bytes.workspace = true
url.workspace = true
futures.workspace = true
futures-util.workspace = true
async-trait.workspace = true

rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
time.workspace = true

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
arc-swap.workspace = true
regex.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
md-5.workspace = true
hex.workspace = true
rand.workspace = true
sha2.workspace = true

# Optional: HTTP/3 transport
quinn = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }

# Optional: embedded webview
wry = { workspace = true, optional = true }
tao = { workspace = true, optional = true }

[features]
default = []
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]
embedded-browser = ["dep:wry", "dep:tao"]
